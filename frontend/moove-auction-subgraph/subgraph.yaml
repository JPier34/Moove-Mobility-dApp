specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MooveAuction
    network: sepolia
    source:
      address: "0xE8f6836A0054B83b9a952e8B62D92e62f5c67606"
      abi: MooveAuction
      startBlock: 9000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Auction
        - AuctionSettled
        - AuctionCreated
      abis:
        - name: MooveAuction
          file: ./abis/MooveAuction.json
      eventHandlers:
        - event: AuctionSettled(indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleAuctionSettled
        - event: AuctionCreated(indexed uint256,indexed address,indexed address,uint256,uint8,uint256,uint256)
          handler: handleAuctionCreated
      callHandlers: []
      blockHandlers: []
      file: ./src/mapping.ts
  - kind: ethereum
    name: MooveNFT
    network: sepolia
    source:
      address: "0x40E455515bf712144C1A5D859F19d64b537754f7"
      abi: MooveNFT
      startBlock: 9000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - NFT
        - Transfer
        - UserCollection
      abis:
        - name: MooveNFT
          file: ./abis/MooveNFT.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      callHandlers: []
      blockHandlers: []
      file: ./src/mapping.ts
